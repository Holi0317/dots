# global tool versions go here
# you can set these with `mise use -g`
[tools]
# Languages
go = "latest"
node = 'lts'
pnpm = "11"
bun = "latest"
uv = "latest"

# Tools
graphite = "latest"
iam-policy-json-to-terraform = "latest"
"pipx:httpie" = "latest"
"pipx:pgcli" = "latest"
terraform = "latest"
terraform-docs = "latest"
"github:can1357/oh-my-pi" = "latest"

[settings]
# read version files used by other version managers, such as .nvmrc
idiomatic_version_file_enable_tools = [
  'node',
  'npm',
  'pnpm',
  'python',
  'terraform',
]

lockfile = true

# env_file = '.env' # load env vars from a dotenv file, see `MISE_ENV_FILE`

[settings.status]
show_env = false
show_tools = false

[settings.npm]
package_manager = "pnpm"

[settings.github]
credential_command = "gh auth token"
